name: Pipeline de Medios — Homicidios

# El motor principal del scraping es ahora el agente local, que corre en la
# computadora del equipo (scripts/pipeline/agente-local.ts, docs/agente-local.md)
# y hace la corrida diaria a las 7. Este workflow queda de RESPALDO: a las
# 12 hs corre solo si ese día la programada no se hizo (computadora apagada,
# agente caído). Lo decide el propio script con --solo-si-no-corrio-hoy,
# mirando corridas_pipeline.
#
# Para volver a usar Actions como motor principal, sacar ese flag y mover el
# cron a '0 10 * * *'. Para desactivarlo del todo, comentar el `schedule`.

on:
  schedule:
    # 12:00 hora Argentina (UTC-3): después de la programada del agente local.
    - cron: '0 15 * * *'
  workflow_dispatch:  # permite correrlo manualmente desde GitHub
    inputs:
      medio:
        description: 'Id de un solo medio a correr (vacío = todos). Para experimentar sin recorrer todos.'
        type: string
        default: ''
      snapshot_max_chars:
        description: 'Override de PIPELINE_SNAPSHOT_MAX_CHARS (vacío = 10000)'
        type: string
        default: ''
      dry_run:
        description: 'No escribir a la base — usar para medir sin contaminar producción'
        type: boolean
        default: true

# Dos corridas simultáneas compiten por las mismas notas: la segunda espera.
concurrency:
  group: pipeline-medios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Salvavidas: el 20/8 esta corrida quedó casi 2h colgada dentro del propio
    # paso, sin que nada la cortara — GitHub la habría dejado seguir hasta las
    # 6h de default.
    #
    # 120 y no 90: el experimento del 22/8 midió que un solo medio a 30000
    # chars puede tardar hasta ~12 min cuando encuentra varias noticias reales
    # (cada una es una extracción LLM aparte). Con 13 medios a 10000, 120 min
    # deja margen real sin ser un cheque en blanco.
    timeout-minutes: 120

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Sin esto, agent-browser/Chrome no arranca en el runner desde el 6 de
      # agosto: "FATAL: No usable sandbox! ... has disabled unprivileged user
      # namespaces with AppArmor". La imagen de ubuntu-latest empezó a
      # restringir los user namespaces sin privilegios que el sandbox interno
      # de Chrome necesita para lanzar su proceso zygote.
      #
      # Se restaura el mecanismo del kernel en vez de pasarle --no-sandbox a
      # Chrome: esto no reduce el sandboxing propio de Chrome, que sigue
      # activo pese a navegar sitios de terceros con contenido no confiable.
      # El runner es una VM efímera exclusiva de este job, así que habilitar
      # esto no expone nada fuera de su propio ciclo de vida.
      - name: Habilitar user namespaces sin privilegios (requisito del sandbox de Chrome)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Instalar Chromium para agent-browser
        run: npx agent-browser install

      - name: Generar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Solo informa: si el esquema de la base no coincide con schema.prisma,
      # el pipeline falla con P2022 en la primera noticia. Verlo acá evita
      # perder una corrida entera diagnosticando a ciegas. No aplica nada
      # (eso lo hace migraciones.yml) ni bloquea la ingesta.
      - name: Verificar estado de migraciones
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Verificar variables de entorno
        run: |
          echo "DATABASE_URL set: ${{ secrets.DATABASE_URL != '' }}"
          echo "OPENCODE_API_KEY set: ${{ secrets.OPENCODE_API_KEY != '' }}"
          echo "OPENROUTER_API_KEY set (respaldo): ${{ secrets.OPENROUTER_API_KEY != '' }}"

      # El cron diario NUNCA manda inputs (no existen fuera de workflow_dispatch),
      # así que PIPELINE_DRY_RUN y --medio no cambian en la corrida programada:
      # sigue en modo real sobre todos los medios activos, y con
      # --solo-si-no-corrio-hoy (respaldo del agente local). Los tres inputs son
      # para cuando se dispara a mano — típicamente para medir un solo medio.
      #
      # El script sale con código 1 si la corrida no es confiable (proveedor
      # LLM caído, browser roto): el workflow queda en ROJO. Antes salía
      # siempre con 0 y del 7 al 24/9/2026 quedó en verde con cero noticias.
      - name: Correr pipeline
        run: >
          npx tsx scripts/pipeline/scrapear-medios.ts
          ${{ github.event_name == 'schedule' && '--solo-si-no-corrio-hoy' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && inputs.medio != '' && format('--medio={0}', inputs.medio) || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPELINE_ORIGEN: github-actions
          # Proveedor activo: OpenCode Go
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Overrides opcionales de modelo, por si Go renombra alguno
          OPENCODE_MODELO_ECONOMICO: ${{ secrets.OPENCODE_MODELO_ECONOMICO }}
          OPENCODE_MODELO_PRECISO: ${{ secrets.OPENCODE_MODELO_PRECISO }}
          # Respaldo automático: si OpenCode Go no responde y este secret está
          # cargado, la corrida sigue con OpenRouter en vez de fallar.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          PIPELINE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          PIPELINE_MAX_NOTICIAS: '10'
          PIPELINE_PERFIL_MODELO: 'economico'
          # Opcional (ver .env.example): bajar el razonamiento del modelo.
          PIPELINE_LLM_RAZONAMIENTO: ${{ vars.PIPELINE_LLM_RAZONAMIENTO }}
          # 10000 fijo para la corrida programada, no el 3000 que quedó como
          # default en el código. A 3000 la corrida real del 22/8 (66 medios)
          # midió que lavoz, rosario3, eltribuno y norte daban CERO — el
          # snapshot solo alcanza el logo y el menú. Sigue siendo overrideable
          # a mano vía el input, para poder afinar el valor con datos sin
          # editar el workflow.
          PIPELINE_SNAPSHOT_MAX_CHARS: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot_max_chars) || '10000' }}

      - name: Notificar resultado
        if: always()
        run: |
          echo "Pipeline completado con estado: ${{ job.status }}"
